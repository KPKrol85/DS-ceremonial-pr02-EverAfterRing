<!doctype html>
<html lang="pl">
  <head>
    <!-- Base metadata -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The hosting platform serves this document for any missing address, including nested ones.
         The site root is therefore the only correct base for the relative links this page and the
         shared shell carry; it has to precede every URL below. -->
    <base href="/" />

    <!-- SEO -->
    <title>Nie znaleziono strony – EverAfter Ring</title>
    <meta name="description" content="Pod tym adresem nie ma strony. Wróć na stronę główną EverAfter Ring lub przejdź do wybranej sekcji serwisu." />
    <!-- An error document has no canonical address of its own and must stay out of the index. -->
    <meta name="robots" content="noindex, follow" />

    <!-- Favicons -->
    <link rel="icon" href="assets/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="EverAfter Ring" />

    <!-- Theme -->
    <meta name="theme-color" content="#faf7f2" data-theme-color />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <script src="js/theme-bootstrap.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <!-- Body -->
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <!-- `<base href="/">` also resolves the fragment-only skip link against the site root, which
         would turn it into a navigation away from this document. Re-pointing it at the address
         actually being served keeps it the same-document jump the other pages have. -->
    <script>
      (() => {
        const skipLink = document.querySelector(".skip-link");

        if (skipLink) {
          skipLink.href = `${location.pathname}${location.search}#main`;
        }
      })();
    </script>

    <!-- Header partial -->
    <header class="site-header" data-partial="header" data-partial-src="partials/header.html"></header>

    <!-- Main -->
    <main id="main">
      <!-- Hero -->
      <section class="hero">
        <div class="container hero__layout">
          <div class="hero__content">
            <span class="badge badge--animate">Błąd 404</span>
            <h1 class="hero__title">Nie znaleźliśmy tej strony.</h1>
            <p class="hero__tagline">Adres mógł się zmienić lub strona została usunięta. Wróćcie na stronę główną albo przejdźcie prosto do wybranej sekcji.</p>
            <div class="hero__actions">
              <a class="button button--primary" href="index.html">Wróć na stronę główną</a>
              <a class="button button--ghost" href="kontakt.html">Napisz do nas</a>
            </div>
            <nav aria-label="Skróty do głównych sekcji serwisu">
              <ul class="list">
                <li><a href="oferta.html">Oferta i pakiety</a></li>
                <li><a href="uslugi.html">Usługi</a></li>
                <li><a href="realizacje.html">Realizacje</a></li>
                <li><a href="o-nas.html">O nas</a></li>
              </ul>
            </nav>
          </div>
          <div class="hero__media" data-hero-image>
            <picture>
              <source
                type="image/avif"
                srcset="assets/img/hero/hero-400.avif 400w, assets/img/hero/hero-800.avif 800w, assets/img/hero/hero-1080.avif 1080w"
                sizes="(min-width: 900px) 45vw, calc(100vw - 2rem)" />
              <source
                type="image/webp"
                srcset="assets/img/hero/hero-400.webp 400w, assets/img/hero/hero-800.webp 800w, assets/img/hero/hero-1080.webp 1080w"
                sizes="(min-width: 900px) 45vw, calc(100vw - 2rem)" />
              <img
                src="assets/img/hero/hero-800.jpg"
                srcset="assets/img/hero/hero-400.jpg 400w, assets/img/hero/hero-800.jpg 800w, assets/img/hero/hero-1080.jpg 1080w"
                sizes="(min-width: 900px) 45vw, calc(100vw - 2rem)"
                width="1080"
                height="720"
                alt="Elegancka scena ślubna z łukiem i światłem"
                decoding="async" />
            </picture>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer partial -->
    <footer class="site-footer" data-partial="footer" data-partial-src="partials/footer.html"></footer>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
